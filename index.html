
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PATRULHAMENTOTÁTICO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
      margin: 0;
      padding: 24px;
    }
    .card {
      background: #1d2b36;
      padding: 20px;
      border-radius: 14px;
      margin-top: 20px;
    }
    h1 { color: #66d9ef; }
    button {
      background: #66d9ef;
      color: #101820;
      border: 0;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
      width: 100%;
    }
    p { line-height: 1.5; }
  </style>
</head>
<body>
  <h1>📍 PATRULHAMENTOTÁTICO</h1>
  <p>Monitoramento de áreas de policiamento</p>

  <div class="card">
    <h2>Minha localização</h2>
    <p id="status">Toque no botão para consultar sua localização.</p>
    <button onclick="localizar()">Consultar localização</button>
  </div>

  <div class="card">
    <h2>Área de policiamento</h2>
    <p id="area">Nenhuma área identificada.</p>
    <p id="delegacia">Delegacia: aguardando configuração.</p>
    <p id="hospital">Hospital próximo: aguardando configuração.</p>
  </div>

  <script>
    function localizar() {
      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.textContent =
          "Seu navegador não oferece suporte à localização.";
        return;
      }

      status.textContent = "Consultando localização...";

      navigator.geolocation.getCurrentPosition(
        function(posicao) {
          const latitude = posicao.coords.latitude;
          const longitude = posicao.coords.longitude;

          status.textContent =
            "Latitude: " + latitude.toFixed(6) +
            " | Longitude: " + longitude.toFixed(6);
        },
        function() {
          status.textContent =
            "Não foi possível obter a localização. Verifique a permissão e tente novamente.";
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }
  </script>
</body>
</html>
